# JDM: Japanese Drift Master.
#
# WHY NOT the R9 identity (346e:0002): JDM ships per-device INPUT presets (in
# pakchunk0) that read each axis by a hardcoded Index into the wheel's HID
# report and apply a fixed scale/offset calibrated to that model on WINDOWS.
# Masquerading as an R9 makes JDM auto-apply its R9 preset, whose byte layout
# and scale do NOT match our Proton-synthesized report — so it re-mangles any
# range we send (the "2000%" pegged axes), and a manual bind can't win while
# the preset is active.
#
# THE FIX: present an UNRECOGNISED MOZA wheel (product 0x0fff matches no JDM
# preset). JDM then has no per-device map and falls back to generic custom
# binding, which reads axes as-emitted — so our clean mode-C 0..32767 axes
# bind correctly. FFB is unaffected: JDM drives force feedback through the
# device's FFB capability (which Proton exposes from the real base via us),
# not through the input preset.
#
# AFTER loading this: in JDM, RE-DO the custom binding from scratch (any old
# binding stored the broken values). Bind steering + pedals fresh.
name = "jdm"
mode = "C"
buttons = 24
axis_range = [0, 32767]
notes = "Unrecognised MOZA id (no JDM preset) + sign-safe 0..32767 axes -> custom-bind in-game. If FFB dies, try identity product 0x0002 (R9) instead."

[identity]
name = "MOZA Wheelbase (mozaproxy)"
vendor = 0x346e
product = 0x0fff

[proton]
env = { PROTON_ENABLE_WAYLAND = "1" }
steam_input = "off"
