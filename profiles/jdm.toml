# JDM: Japanese Drift Master.
#
# JDM officially supports MOZA R5 and R9, so we present the same R9 identity
# that unlocked FH5 (a supported id that provably enumerates cleanly under
# Proton). Mode C, not A: JDM reads the base's UNSIGNED 0..65535 steering axis
# as signed — right of center worked, left of center wrapped to pegged-left —
# so the normalized face presents every axis on one signed range. Its FFB
# shipped rough and was overhauled in the Physics 2.0 update — tune in-game
# FFB settings first, then ffb_gain here if it stays light.
name = "jdm"
mode = "C"
buttons = 24
notes = "MOZA R9 identity + normalized axes (JDM misreads unsigned steering as signed). Tune in-game FFB first; raise ffb_gain if light."

[identity]
name = "MOZA R9 Base"
vendor = 0x346e
product = 0x0002

[proton]
env = { PROTON_ENABLE_WAYLAND = "1" }
steam_input = "off"
